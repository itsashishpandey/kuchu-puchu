# KUCHU PUCHU — reverse proxy to PM2 app "mykuchupuchu" on :4050
# Force https + www -> apex (CF-Visitor tells us the visitor-side scheme behind Cloudflare)
RewriteEngine On
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteCond %{HTTP_HOST} ^www\.mykuchupuchu\.com$ [NC]
RewriteRule ^ https://mykuchupuchu.com%{REQUEST_URI} [R=301,L]
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteCond %{HTTP:CF-Visitor} scheme.:.http[^s]
RewriteRule ^ https://mykuchupuchu.com%{REQUEST_URI} [R=301,L]

# Files written at runtime (creator uploads, thumbnails, avatars) and the Android APK.
# Next.js only serves public/ files that existed at build time, so Apache serves these
# straight from the data folder (which redeploys never touch). Range requests work for video.
Alias /uploads/ /home/ACCOUNT/mykuchupuchu-data/uploads/
Alias /downloads/ /home/ACCOUNT/mykuchupuchu-data/downloads/
<Directory "/home/ACCOUNT/mykuchupuchu-data/uploads">
    Options -Indexes -ExecCGI
    AllowOverride None
    Require all granted
    <FilesMatch "\.(php[0-9]?|phtml|phar|pl|py|cgi|sh|shtml|htaccess)$">
        Require all denied
    </FilesMatch>
    Header set Cache-Control "public, max-age=86400"
</Directory>
<Directory "/home/ACCOUNT/mykuchupuchu-data/downloads">
    Options -Indexes -ExecCGI
    AllowOverride None
    Require all granted
    AddType application/vnd.android.package-archive .apk
    Header set Cache-Control "no-store"
</Directory>

ProxyPreserveHost On
ProxyPass "/.well-known/" "!"
ProxyPass "/uploads/" "!"
ProxyPass "/downloads/" "!"
# Everything else goes to the app, EXCEPT cPanel's own /___proxy_* paths: further down this
# vhost cPanel rewrites webmail./cpanel./webdisk. hosts and ActiveSync to /___proxy_subdomain_*
# and /___proxy_activesync and proxies them to its services. A plain `ProxyPass "/"` here would
# swallow those (webmail.mykuchupuchu.com showed the app's 404). Not "!" — that stops all
# ProxyPass matching, so cPanel's later rules would never run.
# 300 s: video uploads are checked and fingerprinted (ffprobe/ffmpeg) before the reply
ProxyPassMatch "^/(?!___proxy_)(.*)$" "http://127.0.0.1:4050/$1" retry=0 timeout=300
ProxyPassReverse "/" "http://127.0.0.1:4050/"
RequestHeader set X-Forwarded-Proto "https"
